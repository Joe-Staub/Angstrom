- gridRows: 3
  gridColumns: 30
  name: Left-Side-Scanner_Logic
  associatedDeviceName: Left-Side-Scanner-Net
  triggerMode: OnEvent
  order: 1
  steps:
  - action:
      actionType: NoOp
      name: Cell 0 1
  - action:
      actionType: Math
      sourceType: Device
      operator: SetVariableToValue
      variable: Left-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
  - action:
      actionType: If
      sourceType: Variable
      source: Left-Stack-Alert
      compareOperator: =
      containsStartPositionVariable: Date
      containsInstanceCountVariable: Date
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 5
    trueBranch:
    - action:
        actionType: Math
        sourceType: Value
        source: No Read Barcode.
        operator: SetVariableToValue
        variable: Error-Mesage
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 6
    - action:
        actionType: Math
        sourceType: Value
        source: 2
        operator: SetVariableToValue
        variable: Error-Mesage
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 7
    - action:
        actionType: If
        sourceType: Variable
        source: Left-PartId-Data
        compareOperator: <>
        containsStartPositionVariable: Date
        containsInstanceCountVariable: Date
        comparedToType: Variable
        comparedTo: NOREAD
        name: Cell 0 8
      trueBranch:
      - action:
          actionType: RegexExtract
          sourceType: Variable
          source: Left-PartId-Data
          patternType: Value
          pattern: ^ESAT(?<LeftLblYear>\d{2})(?<LeftDayOfYear>\d{3})(?<LeftLine>\d)(?<LeftDailySequence>\d{4})(?<LeftGMPartNumber>\d{8})(?<SupPartNumber>\d*)$
          name: Cell 0 9
      - action:
          actionType: Math
          sourceType: Value
          source: Part belongs on the other line
          operator: SetVariableToValue
          variable: Error-Mesage
          clearStartIndex: 1
          clearLength: 1
          name: Cell 0 8
      - action:
          actionType: Math
          sourceType: Value
          source: 3
          operator: SetVariableToValue
          variable: Error-State
          clearStartIndex: 1
          clearLength: 1
          name: Cell 0 11
      - action:
          actionType: If
          sourceType: Variable
          source: Left-Part-Number
          compareOperator: <>
          containsStartPositionVariable: Date
          containsInstanceCountVariable: Date
          comparedToType: Variable
          comparedTo: Left-Supplier-Part-No-Constant
          name: Cell 0 11
        trueBranch:
        - action:
            actionType: ActionBirth
            partNumberType: Variable
            partNumber: LeftGMPartNumber
            partProducerType: Constant
            partProducer: Angstrom
            partSerialNumberType: Variable
            partSerialNumber: Left-PartId-Data
            lotQuantityType: Value
            lotQuantity: 1
            statusVariableType: Variable
            statusVariable: Left-DB-Result
            name: Cell 0 12
        - action:
            actionType: Math
            sourceType: Value
            source: Duplicate Part, already in the database
            operator: SetVariableToValue
            variable: Error-Mesage
            clearStartIndex: 1
            clearLength: 1
            name: Cell 0 13
        - action:
            actionType: Math
            sourceType: Value
            source: 4
            operator: SetVariableToValue
            variable: Error-State
            clearStartIndex: 1
            clearLength: 1
            name: Cell 0 15
        - action:
            actionType: If
            sourceType: Variable
            source: Left-DB-Result
            compareOperator: =
            containsStartPositionVariable: Date
            containsInstanceCountVariable: Date
            comparedToType: Value
            comparedTo: 0
            name: Cell 0 15
          trueBranch:
          - action:
              actionType: CallSubroutine
              continueOnFailure: false
              name: Cell 0 15
          - action:
              actionType: Math
              operator: IncrementAsNumber
              variable: Left-Container-Count
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 17
          - action:
              actionType: Math
              sourceType: Variable
              source: Left-Current-Container
              operator: IncrementAsNumber
              variable: Left-Production-Count
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 18
          - action:
              actionType: Math
              sourceType: Value
              source: Can't save persistent data, CALL IT1
              operator: SetVariableToValue
              variable: Error-Mesage
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 19
          - action:
              actionType: Math
              sourceType: Value
              source: 5
              operator: SetVariableToValue
              variable: Error-State
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 20
          - action:
              actionType: PersistVars
              mode: Save
              group: Angstrom-Axle-Tube
              status: Left-Persist-Status
              name: Cell 0 19
          - action:
              actionType: If
              sourceType: Variable
              source: Left-Persist-Status
              compareOperator: =
              containsStartPositionVariable: Date
              containsInstanceCountVariable: Date
              comparedToType: Value
              comparedTo: Success
              name: Cell 0 20
            trueBranch:
            - action:
                actionType: Math
                sourceType: Value
                source: Can't Add to Lot
                operator: SetVariableToValue
                variable: Error-Mesage
                clearStartIndex: 1
                clearLength: 1
                name: Cell 0 23
            - action:
                actionType: Math
                sourceType: Value
                source: 6
                operator: SetVariableToValue
                variable: Error-State
                clearStartIndex: 1
                clearLength: 1
                name: Cell 0 24
            - action:
                actionType: ActionConsumeMaterial
                consumedMaterialSerialNumberArrayStartIndexType: Constant
                consumedMaterialSerialNumberArrayLengthType: Constant
                bOMCheck: False
                name: Cell 0 25
                description: Add to Batch
            - action:
                actionType: If
                sourceType: Variable
                source: Left-DB-Result
                compareOperator: =
                containsStartPositionVariable: BLANK
                containsInstanceCountVariable: BLANK
                comparedToType: Value
                comparedTo: 0
                name: Cell 0 26
              trueBranch:
              - action:
                  actionType: FillTemplate
                  templateSourceType: Variable
                  templateVariable: AxleTemplate
                  outputVariable: Left-Print-Buffer
                  name: Cell 0 26
              - action:
                  actionType: ActionWriteToDevice
                  sourceType: Variable
                  source: Left-Print-Buffer
                  addCrLf: Yes
                  device: Left-Axel-Printer
                  status: Error-Mesage
                  name: Cell 0 27
              - action:
                  actionType: If
                  sourceType: Variable
                  source: Left-Container-Count
                  compareOperator: =
                  containsStartPositionVariable: Date
                  containsInstanceCountVariable: Date
                  comparedToType: Value
                  comparedTo: 18
                  name: Cell 0 28
                trueBranch:
                - action:
                    actionType: CallSubroutine
                    subroutineName: Box-Print-Label
                    continueOnFailure: false
                    name: Cell 0 32
        falseBranch:
        - action:
            actionType: NoOp
            name: Cell 1 10
    falseBranch:
    - action:
        actionType: NoOp
        name: Cell 1 5
