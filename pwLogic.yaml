- gridRows: 3
  gridColumns: 35
  name: Left-Side-Scanner_Logic
  associatedDeviceName: Left-Side-Scanner
  triggerMode: OnEvent
  order: 1
  steps:
  - action:
      actionType: NoOp
      name: Cell 0 1
  - action:
      actionType: Math
      sourceType: Device
      operator: SetVariableToValue
      variable: Left-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
  - action:
      actionType: Math
      sourceType: Value
      source: Clear the fault
      operator: SetVariableToValue
      variable: Error-Mesage
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 3
  - action:
      actionType: Math
      sourceType: Value
      source: 1
      operator: SetVariableToValue
      variable: Error-State
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 4
  - action:
      actionType: If
      sourceType: Variable
      source: Stack-Light
      compareOperator: =
      containsStartPositionVariable: Date
      containsInstanceCountVariable: Date
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 5
    trueBranch:
    - action:
        actionType: Math
        sourceType: Value
        source: No Read Barcode.
        operator: SetVariableToValue
        variable: Error-Mesage
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 6
    - action:
        actionType: Math
        sourceType: Value
        source: 2
        operator: SetVariableToValue
        variable: Error-Mesage
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 7
    - action:
        actionType: If
        sourceType: Variable
        source: Left-PartId-Data
        compareOperator: <>
        containsStartPositionVariable: Date
        containsInstanceCountVariable: Date
        comparedToType: Value
        comparedTo: NOREAD
        name: Cell 0 8
      trueBranch:
      - action:
          actionType: RegexExtract
          sourceType: Variable
          source: Left-SupPartNumber>
          patternType: Value
          pattern: ESAT(?<Left-LblYear>\d{2})(?<Left-DayOfYear>\d{3})(?<Left-Line>\d)(?<Left-DailySequence>\d{4})(?<Left-GMPartNumber>\d{8})(?<Left-SupPartNumber>\d(9)*)
          name: Cell 0 9
      - action:
          actionType: SubString
          sourceType: Variable
          source: Left-PartId-Data
          startCharType: Value
          startChar: 15
          lengthType: Value
          length: 6
          dest: Left-Part-Number
          name: Cell 0 9
      - action:
          actionType: Math
          sourceType: Value
          source: Part belongs on the other line
          operator: SetVariableToValue
          variable: Error-Mesage
          clearStartIndex: 1
          clearLength: 1
          name: Cell 0 10
      - action:
          actionType: Math
          sourceType: Value
          source: 3
          operator: SetVariableToValue
          variable: Error-State
          clearStartIndex: 1
          clearLength: 1
          name: Cell 0 11
      - action:
          actionType: If
          sourceType: Variable
          source: Left-Part-Number
          compareOperator: <>
          containsStartPositionVariable: Date
          containsInstanceCountVariable: Date
          comparedToType: Value
          comparedTo: 85545338
          name: Cell 0 11
        trueBranch:
        - action:
            actionType: ActionBirth
            partNumberType: Variable
            partNumber: Left-Part-Number
            partProducerType: Constant
            partProducer: ABCCompany
            partSerialNumberType: Variable
            partSerialNumber: Left-PartId-Data
            lotQuantityType: Value
            lotQuantity: 1
            statusVariableType: Variable
            statusVariable: Left-DB-Result
            name: Cell 0 13
        - action:
            actionType: Math
            sourceType: Value
            source: Duplicate Part, already in the database
            operator: SetVariableToValue
            variable: Error-Mesage
            clearStartIndex: 1
            clearLength: 1
            name: Cell 0 13
        - action:
            actionType: Math
            sourceType: Value
            source: 4
            operator: SetVariableToValue
            variable: Error-State
            clearStartIndex: 1
            clearLength: 1
            name: Cell 0 15
        - action:
            actionType: If
            sourceType: Variable
            source: Left-DB-Result
            compareOperator: =
            containsStartPositionVariable: Date
            containsInstanceCountVariable: Date
            comparedToType: Value
            comparedTo: 0
            name: Cell 0 16
          trueBranch:
          - action:
              actionType: Math
              operator: IncrementAsNumber
              variable: Left-Container-Count
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 17
          - action:
              actionType: Math
              sourceType: Variable
              source: Left-Current-Container
              operator: IncrementAsNumber
              variable: Left-Production-Count
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 18
          - action:
              actionType: Math
              sourceType: Value
              source: Can't save persistent data, CALL IT1
              operator: SetVariableToValue
              variable: Error-Mesage
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 19
          - action:
              actionType: Math
              sourceType: Value
              source: 5
              operator: SetVariableToValue
              variable: Error-State
              clearStartIndex: 1
              clearLength: 1
              name: Cell 0 20
          - action:
              actionType: PersistVars
              mode: Save
              group: Angstrom-Axle-Tube
              status: Left-Persist-Status
              name: Cell 0 19
          - action:
              actionType: If
              sourceType: Variable
              source: Left-Persist-Status
              compareOperator: =
              containsStartPositionVariable: Date
              containsInstanceCountVariable: Date
              comparedToType: Value
              comparedTo: Success
              name: Cell 0 20
            trueBranch:
            - action:
