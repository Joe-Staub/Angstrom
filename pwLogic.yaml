- gridRows: 3
  gridColumns: 10
  name: CreateCSV
  associatedDeviceName: Subroutine
  triggerMode: OnEvent
  order: 0
  steps:
  - action:
      actionType: FillTemplate
      templateSourceType: Inline
      templateText: C:\AxleReports\${TImestamp}.csv
      outputVariable: ReportFolder
      name: Cell 0 1
  - action:
      actionType: DBExportCsv
      databaseConnection: PWDatabase
      sql: >2-

        John Green <johngreen49@gmail.com>

        9:35 AM (0 minutes ago)

        to me


        SELECT

        parent.Serial_Nbr                             AS ParentSerial,

        pp.Part_Number                              AS ParentPart,

        parent.Birth_DateTime                       AS ParentBorn,

        g.Child_Part_Number                         AS ChildPart,

        g.Child_Serial_Number                       AS ChildSerial,

        child.Birth_DateTime                        AS ChildBorn

        FROM dbo.Item parent

        INNER JOIN dbo.Part pp        ON pp.Part_Key = parent.Part_Key

        LEFT  JOIN dbo.Item_Gene g    ON g.Parent_Item_Key = parent.Item_Key

        LEFT  JOIN dbo.Item child     ON child.Item_Key = g.Child_Item_Key

        WHERE pp.Part_Number IN ("85545338","85545339")  
         AND  parent.Birth_DateTime >= CAST(GETDATE() AS date)
        ORDER BY parent.Birth_DateTime,

        parent.Serial_Nbr,

        g.Child_Part_Number,

        g.Child_Serial_Number
      parameters: []
      filePathType: Variable
      filePath: ReportFolder
      append: No
      includeHeader: Yes
      delimiter: Comma
      commandTimeoutSeconds: 60
      status: Error-Mesage
      rowCountVariable: CSV_Rowvount
      name: Cell 0 1
