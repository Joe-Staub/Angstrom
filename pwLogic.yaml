- gridRows: 3
  gridColumns: 10
  name: Left-Box-Check
  associatedDeviceName: Subroutine
  triggerMode: OnEvent
  order: 0
  steps:
  - action:
      actionType: If
      sourceType: Variable
      source: Left-DB-Result
      compareOperator: =
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 1
      description: Consumed into the box?
    trueBranch:
    - action:
        actionType: NoOp
        name: Cell 0 2
    - action:
        actionType: If
        sourceType: Variable
        source: Left-Lot-Status
        compareOperator: =
        comparedToType: Value
        comparedTo: Pass
        name: Cell 0 3
        description: Box count updated?
      trueBranch:
      - action:
          actionType: NoOp
          name: Cell 0 4
      - action:
          actionType: If
          sourceType: Variable
          source: Left-Container-Count
          compareOperator: <
          comparedToType: Variable
          comparedTo: BATCH_SIZE
          name: Cell 0 5
          description: Room left in the box?
        trueBranch:
        - action:
            actionType: NoOp
            name: Cell 0 6
            description: Box not full yet
        falseBranch:
        - action:
            actionType: CallSubroutine
            subroutineName: Left-Box-Print-Label
            continueOnFailure: false
            name: Cell 1 5
            description: Box full
        - action:
            actionType: CallSubroutine
            subroutineName: CreateLeftLot
            continueOnFailure: false
            name: Cell 1 6
      falseBranch:
      - action:
          actionType: CallSubroutine
          subroutineName: Left-Count-Error
          continueOnFailure: true
          name: Cell 1 3
          description: In the box, but the count failed
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Lot-Error
        continueOnFailure: true
        name: Cell 1 1
        description: Not in a box
