- gridRows: 3
  gridColumns: 10
  name: Left-Ensure-Box
  associatedDeviceName: Subroutine
  triggerMode: OnEvent
  order: 0
  steps:
  - action:
      actionType: If
      sourceType: Variable
      source: LeftLotLabel
      compareOperator: IsNotEmpty
      name: Cell 0 1
      description: Is a box known?
    trueBranch:
    - action:
        actionType: ActionLotManagement
        partNumberType: Variable
        partNumber: LEFT_CONTAINER
        partProducerType: Constant
        partProducer: Angstrom
        partSerialNumberType: Variable
        partSerialNumber: LeftLotLabel
        lotQuantityType: Value
        lotQuantity: 0
        action: GetLotQuantityValue
        resultVariable: Left-Container-Count
        statusVariable: Left-Lot-Status
        name: Cell 0 2
        description: Read the box count from the DB
    - action:
        actionType: If
        sourceType: Variable
        source: Left-Lot-Status
        compareOperator: =
        comparedToType: Value
        comparedTo: Pass
        name: Cell 0 3
        description: Box found?
      trueBranch:
      - action:
          actionType: NoOp
          name: Cell 0 4
      - action:
          actionType: NoOp
          name: Cell 0 5
      - action:
          actionType: If
          sourceType: Variable
          source: Left-Container-Count
          compareOperator: <
          comparedToType: Variable
          comparedTo: BATCH_SIZE
          name: Cell 0 6
          description: Still room? A full box whose successor failed to open gets one now
        trueBranch:
        - action:
            actionType: NoOp
            name: Cell 0 7
            description: Box in use
        falseBranch:
        - action:
            actionType: CallSubroutine
            subroutineName: CreateLeftLot
            continueOnFailure: false
            name: Cell 1 6
            description: Box already full
      falseBranch:
      - action:
          actionType: If
          sourceType: Variable
          source: Left-Lot-Status
          compareOperator: Contains
          comparedToType: Value
          comparedTo: Item not found
          name: Cell 1 3
          description: Missing box, or a database failure?
        trueBranch:
        - action:
            actionType: CallSubroutine
            subroutineName: CreateLeftLot
            continueOnFailure: false
            name: Cell 1 4
            description: Box missing in DB
        falseBranch:
        - action:
            actionType: Math
            sourceType: Variable
            source: Left-Lot-Status
            operator: SetVariableToValue
            variable: Left-Error-Message
            clearStartIndex: 1
            clearLength: 1
            name: Cell 2 3
            description: Database problem, keep the current box
        - action:
            actionType: CallSubroutine
            subroutineName: Left-Flag-Error
            continueOnFailure: true
            name: Cell 2 4
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: CreateLeftLot
        continueOnFailure: false
        name: Cell 1 1
        description: No box yet
- gridRows: 3
