- gridRows: 4
  gridColumns: 20
  name: Right-Side-Scanner_Logic
  associatedDeviceName: Right-Side-Scanner-Net
  triggerMode: OnEvent
  order: 1
  steps:
  - action:
      actionType: If
      sourceType: Variable
      source: Right-Stack-Alert
      compareOperator: =
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 1
      description: Error posted and not cleared? Then ignore the scan entirely
    falseBranch:
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 1
        description: Scan ignored
  - action:
      actionType: Math
      sourceType: Variable
      source: BLANK
      operator: SetVariableToValue
      variable: Right-Error-Message
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
      description: New scan, clear the last message
  - action:
      actionType: Math
      sourceType: Variable
      source: FormattedTimeStamp
      operator: SetVariableToValue
      variable: Right-PartId-Scan-Time
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 3
  - action:
      actionType: Math
      sourceType: Device
      operator: SetVariableToValue
      variable: Right-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 4
  - action:
      actionType: Math
      sourceType: Variable
      source: Right-PartId-Data
      operator: ConvertToUpperCase
      variable: Right-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 5
      description: Scanners send esat or ESAT
  - action:
      actionType: If
      sourceType: Variable
      source: Right-PartId-Data
      compareOperator: <>
      comparedToType: Value
      comparedTo: NOREAD
      name: Cell 0 6
      description: A no-read arrives as NOREAD after the uppercase step
    falseBranch:
    - action:
        actionType: Math
        sourceType: Value
        source: No read - scan the tube again
        operator: SetVariableToValue
        variable: Right-Error-Message
        clearStartIndex: 1
        clearLength: 1
        name: Cell 1 6
        description: A notice only; the next scan clears it
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 7
        description: No read
  - action:
      actionType: CallSubroutine
      subroutineName: Right-Clear-Parsed
      continueOnFailure: true
      name: Cell 0 7
      description: Blank the parsed fields
  - action:
      actionType: RegexExtract
      sourceType: Variable
      source: Right-PartId-Data
      patternType: Value
      pattern: (esat|ESAT)(?<RightLblYear>\d{2})(?<RightDayOfYear>\d{3})(?<RightLine>\d)(?<RightDailySequence>\d{4})(?<RightGMPartNumber>\d{8})(?<RightSupPartNumber>\d*)
      name: Cell 0 8
  - action:
      actionType: If
      sourceType: Variable
      source: RightGMPartNumber
      compareOperator: <>
      comparedToType: Value
      comparedTo: '-'
      name: Cell 0 9
      description: Did the ID parse?
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Right-Parse-Error
        continueOnFailure: false
        name: Cell 1 9
        description: Unreadable ID, treated like a duplicate
  - action:
      actionType: If
      sourceType: Variable
      source: RightGMPartNumber
      compareOperator: =
      comparedToType: Variable
      comparedTo: Right-Supplier-Part-No-Constant
      name: Cell 0 10
      description: This line's part?
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Right-Wrong-Part
        continueOnFailure: false
        name: Cell 1 10
        description: Other line, or unknown part
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 11
  - action:
      actionType: ActionBirth
      partNumberType: Variable
      partNumber: RightGMPartNumber
      partProducerType: Constant
      partProducer: Angstrom
      partSerialNumberType: Variable
      partSerialNumber: Right-PartId-Data
      lotQuantityType: Value
      lotQuantity: 1
      statusVariableType: Variable
      statusVariable: Right-DB-Result
      name: Cell 0 11
  - action:
      actionType: If
      sourceType: Variable
      source: Right-DB-Result
      compareOperator: =
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 12
      description: Birthed?
    trueBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Right-Axle-Print-Label
        continueOnFailure: false
        name: Cell 0 13
    - action:
        actionType: Math
        operator: IncrementAsNumber
        variable: Right-Production-Count
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 14
    - action:
        actionType: PersistVars
        mode: Save
        group: Angstrom-Axle-Tube
        status: Right-Persist-Status
        name: Cell 0 15
    - action:
        actionType: CallSubroutine
        subroutineName: RightAddToBatch
        continueOnFailure: false
        name: Cell 0 16
        description: Add to Batch
    - action:
        actionType: CallSubroutine
        subroutineName: Right-Box-Check
        continueOnFailure: false
        name: Cell 0 17
        description: Count it, close the box when full
    falseBranch:
    - action:
        actionType: If
        sourceType: Variable
        source: Right-PartId-Data
        compareOperator: =
        comparedToType: Variable
        comparedTo: Right-Unboxed-Serial
        name: Cell 1 12
        description: A tube that was labelled but never boxed? Box it now
      trueBranch:
      - action:
          actionType: Math
          sourceType: Value
          source: Tube added to its box
          operator: SetVariableToValue
          variable: Right-Error-Message
          clearStartIndex: 1
          clearLength: 1
          name: Cell 1 13
      - action:
          actionType: Math
          sourceType: Variable
          source: BLANK
          operator: SetVariableToValue
          variable: Right-Unboxed-Serial
          clearStartIndex: 1
          clearLength: 1
          name: Cell 1 14
      - action:
          actionType: CallSubroutine
          subroutineName: RightAddToBatch
          continueOnFailure: false
          name: Cell 1 15
      - action:
          actionType: CallSubroutine
          subroutineName: Right-Box-Check
          continueOnFailure: false
          name: Cell 1 16
      falseBranch:
      - action:
          actionType: If
          sourceType: Variable
          source: Right-DB-Result
          compareOperator: Contains
          comparedToType: Value
          comparedTo: IX_Item_Entity_Serial
          name: Cell 2 12
          description: A duplicate, or did the database fail?
        trueBranch:
        - action:
            actionType: CallSubroutine
            subroutineName: RightAlert
            continueOnFailure: true
            name: Cell 2 13
        - action:
            actionType: Math
            sourceType: Value
            source: Duplicate Part, already in the database
            operator: SetVariableToValue
            variable: Right-Error-Message
            clearStartIndex: 1
            clearLength: 1
            name: Cell 2 14
