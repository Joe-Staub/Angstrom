- gridRows: 3
  gridColumns: 10
  name: CreateCSV
  associatedDeviceName: Subroutine
  triggerMode: OnEvent
  order: 0
  steps:
  - action:
      actionType: FillTemplate
      templateSourceType: Inline
      templateText: C:\AxleReports\${TimeStamp}.csv
      outputVariable: ReportFolder
      name: Cell 0 1
  - action:
      actionType: DBExportCsv
      databaseConnection: PWDatabase
      sql: |-
        SELECT  parent.Serial_Nbr      AS ParentSerial,
                pp.Part_Number         AS ParentPart,
                parent.Birth_DateTime  AS ParentBorn,
                cp.Part_Number         AS ChildPart,
                child.Serial_Nbr       AS ChildSerial,
                child.Birth_DateTime   AS ChildBorn
        FROM    dbo.Item child
                INNER JOIN dbo.Part cp        ON cp.Part_Key = child.Part_Key
                LEFT  JOIN dbo.Item_Gene g    ON g.Child_Item_Key = child.Item_Key
                LEFT  JOIN dbo.Item parent    ON parent.Item_Key = g.Parent_Item_Key
                LEFT  JOIN dbo.Part pp        ON pp.Part_Key = parent.Part_Key
        WHERE   cp.Part_Number IN ('85545338', '85545339')
          AND   child.Birth_DateTime >= DATEADD(day, -1, CAST(GETDATE() AS date))
          AND   child.Birth_DateTime <  CAST(GETDATE() AS date)
        ORDER BY child.Birth_DateTime, child.Serial_Nbr
      parameters: []
      filePathType: Variable
      filePath: ReportFolder
      append: No
      includeHeader: Yes
      delimiter: Comma
      commandTimeoutSeconds: 60
      status: Error-Mesage
      rowCountVariable: CSV_Rowvount
      name: Cell 0 2
      description: Runs at midnight, so it lists the tubes born the previous day with the box each went into
- gridRows: 3
  gridColumns: 10
  name: CreateLeftLot
  associatedDeviceName: Subroutine
  triggerMode: OnEvent
  order: 0
  steps:
  - action:
      actionType: DBProcedure
      databaseConnection: PWDatabase
      procedureName: dbo.Angstrom_NextLotNumber
      status: Left-Lot-Status
      inputs:
      - name: '@PartNumber'
        dataSourceType: Variable
        dataSource: LEFT_CONTAINER
        dataType: String
        dataLength: 50
      results:
      - name: '@NextLot'
        dataType: Numeric
        variable: LeftLotNumber
        resultKind: OutputParam
      name: Cell 0 1
      description: Next box number from the DB
  - action:
      actionType: If
      sourceType: Variable
      source: Left-Lot-Status
      compareOperator: =
      comparedToType: Value
      comparedTo: Success
      name: Cell 0 2
    trueBranch:
    - action:
        actionType: FillTemplate
        templateSourceType: Inline
        templateText: L${LeftLotNumber:%05d}
        outputVariable: LeftLotLabel
        name: Cell 0 3
        description: New box serial
    - action:
        actionType: ActionBirth
        partNumberType: Variable
        partNumber: LEFT_CONTAINER
        partProducerType: Constant
        partProducer: Angstrom
        partSerialNumberType: Variable
        partSerialNumber: LeftLotLabel
        lotQuantityType: Value
        lotQuantity: 0
        statusVariableType: Variable
        statusVariable: Left-DB-Result
        name: Cell 0 4
        description: Birth the box with count 0
    - action:
        actionType: If
        sourceType: Variable
        source: Left-DB-Result
        compareOperator: =
        comparedToType: Value
        comparedTo: 0
        name: Cell 0 5
      trueBranch:
      - action:
          actionType: Math
          sourceType: Value
          source: 0
          operator: SetVariableToValue
          variable: Left-Container-Count
          clearStartIndex: 1
          clearLength: 1
          name: Cell 0 6
      - action:
          actionType: PersistVars
          mode: Save
          group: Angstrom-Axle-Tube
          status: Left-Persist-Status
          name: Cell 0 7
          description: Remember the open box
      falseBranch:
      - action:
          actionType: Math
          sourceType: Value
          source: Cannot create a new box
          operator: SetVariableToValue
          variable: Left-Error-Message
          clearStartIndex: 1
          clearLength: 1
          name: Cell 1 5
      - action:
          actionType: CallSubroutine
          subroutineName: Left-Flag-Error
          continueOnFailure: true
          name: Cell 1 6
    falseBranch:
    - action:
        actionType: Math
        sourceType: Value
        source: Cannot get the next box number
        operator: SetVariableToValue
        variable: Left-Error-Message
        clearStartIndex: 1
        clearLength: 1
        name: Cell 1 2
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Flag-Error
        continueOnFailure: true
        name: Cell 1 3
