- gridRows: 4
  gridColumns: 20
  name: Left-Side-Scanner_Logic
  associatedDeviceName: Left-Side-Scanner-Net
  triggerMode: OnEvent
  order: 1
  steps:
  - action:
      actionType: If
      sourceType: Variable
      source: Left-Stack-Alert
      compareOperator: =
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 1
      description: Error posted and not cleared? Then ignore the scan entirely
    falseBranch:
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 1
        description: Scan ignored
  - action:
      actionType: Math
      sourceType: Variable
      source: BLANK
      operator: SetVariableToValue
      variable: Left-Error-Message
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
      description: New scan, clear the last message
  - action:
      actionType: Math
      sourceType: Variable
      source: FormattedTimeStamp
      operator: SetVariableToValue
      variable: Left-PartId-Scan-Time
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 3
  - action:
      actionType: Math
      sourceType: Device
      operator: SetVariableToValue
      variable: Left-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 4
  - action:
      actionType: Math
      sourceType: Variable
      source: Left-PartId-Data
      operator: ConvertToUpperCase
      variable: Left-PartId-Data
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 5
      description: Scanners send esat or ESAT
  - action:
      actionType: If
      sourceType: Variable
      source: Left-PartId-Data
      compareOperator: <>
      comparedToType: Value
      comparedTo: NOREAD
      name: Cell 0 6
      description: A no-read arrives as NOREAD after the uppercase step
    falseBranch:
    - action:
        actionType: Math
        sourceType: Value
        source: No read - scan the tube again
        operator: SetVariableToValue
        variable: Left-Error-Message
        clearStartIndex: 1
        clearLength: 1
        name: Cell 1 6
        description: A notice only; the next scan clears it
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 7
        description: No read
  - action:
      actionType: CallSubroutine
      subroutineName: Left-Clear-Parsed
      continueOnFailure: true
      name: Cell 0 7
      description: Blank the parsed fields
  - action:
      actionType: RegexExtract
      sourceType: Variable
      source: Left-PartId-Data
      patternType: Value
      pattern: (esat|ESAT)(?<LeftLblYear>\d{2})(?<LeftDayOfYear>\d{3})(?<LeftLine>\d)(?<LeftDailySequence>\d{4})(?<LeftGMPartNumber>\d{8})(?<LeftSupPartNumber>\d*)
      name: Cell 0 8
  - action:
      actionType: If
      sourceType: Variable
      source: LeftGMPartNumber
      compareOperator: <>
      comparedToType: Value
      comparedTo: '-'
      name: Cell 0 9
      description: Did the ID parse?
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Parse-Error
        continueOnFailure: false
        name: Cell 1 9
        description: Unreadable ID, treated like a duplicate
  - action:
      actionType: If
      sourceType: Variable
      source: LeftGMPartNumber
      compareOperator: =
      comparedToType: Variable
      comparedTo: Left-Supplier-Part-No-Constant
      name: Cell 0 10
      description: This line's part?
    falseBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Wrong-Part
        continueOnFailure: false
        name: Cell 1 10
        description: Other line, or unknown part
    - action:
        actionType: Stop
        stopped: false
        name: Cell 1 11
  - action:
      actionType: ActionBirth
      partNumberType: Variable
      partNumber: LeftGMPartNumber
      partProducerType: Constant
      partProducer: Angstrom
      partSerialNumberType: Variable
      partSerialNumber: Left-PartId-Data
      lotQuantityType: Value
      lotQuantity: 1
      statusVariableType: Variable
      statusVariable: Left-DB-Result
      name: Cell 0 11
  - action:
      actionType: If
      sourceType: Variable
      source: Left-DB-Result
      compareOperator: =
      comparedToType: Value
      comparedTo: 0
      name: Cell 0 12
      description: Birthed?
    trueBranch:
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Axle-Print-Label
        continueOnFailure: false
        name: Cell 0 13
    - action:
        actionType: Math
        operator: IncrementAsNumber
        variable: Left-Production-Count
        clearStartIndex: 1
        clearLength: 1
        name: Cell 0 14
    - action:
        actionType: PersistVars
        mode: Save
        group: Angstrom-Axle-Tube
        status: Left-Persist-Status
        name: Cell 0 15
    - action:
        actionType: CallSubroutine
        subroutineName: LeftAddToBatch
        continueOnFailure: false
        name: Cell 0 16
        description: Add to Batch
    - action:
        actionType: CallSubroutine
        subroutineName: Left-Box-Check
        continueOnFailure: false
        name: Cell 0 17
        description: Count it, close the box when full
    falseBranch:
    - action:
        actionType: If
        sourceType: Variable
        source: Left-PartId-Data
        compareOperator: =
        comparedToType: Variable
        comparedTo: Left-Unboxed-Serial
        name: Cell 1 12
        description: A tube that was labelled but never boxed? Box it now
      trueBranch:
      - action:
          actionType: Math
          sourceType: Value
          source: Tube added to its box
          operator: SetVariableToValue
          variable: Left-Error-Message
          clearStartIndex: 1
          clearLength: 1
          name: Cell 1 13
      - action:
          actionType: Math
          sourceType: Variable
          source: BLANK
          operator: SetVariableToValue
          variable: Left-Unboxed-Serial
          clearStartIndex: 1
          clearLength: 1
          name: Cell 1 14
      - action:
          actionType: CallSubroutine
          subroutineName: LeftAddToBatch
          continueOnFailure: false
          name: Cell 1 15
      - action:
          actionType: CallSubroutine
          subroutineName: Left-Box-Check
          continueOnFailure: false
          name: Cell 1 16
      falseBranch:
      - action:
          actionType: If
          sourceType: Variable
          source: Left-DB-Result
          compareOperator: Contains
          comparedToType: Value
          comparedTo: IX_Item_Entity_Serial
          name: Cell 2 12
          description: A duplicate, or did the database fail?
        trueBranch:
        - action:
            actionType: CallSubroutine
            subroutineName: LeftAlert
            continueOnFailure: true
            name: Cell 2 13
        - action:
            actionType: Math
            sourceType: Value
            source: Duplicate Part, already in the database
            operator: SetVariableToValue
            variable: Left-Error-Message
            clearStartIndex: 1
            clearLength: 1
            name: Cell 2 14
        - action:
            actionType: CallSubroutine
            subroutineName: Left-Log-Duplicate
            continueOnFailure: true
            name: Cell 2 15
            description: Record the duplicate scan
        falseBranch:
        - action:
            actionType: Math
            sourceType: Variable
            source: Left-DB-Result
            operator: SetVariableToValue
            variable: Left-Error-Message
            clearStartIndex: 1
            clearLength: 1
            name: Cell 3 12
            description: Show the database error
        - action:
            actionType: CallSubroutine
            subroutineName: Left-Flag-Error
            continueOnFailure: true
            name: Cell 3 13
